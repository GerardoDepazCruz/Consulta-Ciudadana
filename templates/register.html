<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - CABOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .error-text { color: #c62828; font-size: 14px; margin-top: 4px; display: block; font-weight: 500; }
        input.error { border: 1.5px solid #c62828 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="card-header">
                <a href="/" class="back-link">← Volver</a>
                <div class="header-icon-wrap">
                    <img src="{{ url_for('static', filename='images/logo1.png') }}" style="width:42px;height:42px;object-fit:contain;">
                </div>
                <h2 class="form-title">Crear Cuenta</h2>
                <p class="form-subtitle">Completa tus datos para registrarte</p>
            </div>

            <div class="card-body">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombres">Nombres</label>
                            <input type="text" id="nombres" name="nombres" maxlength="30" placeholder="Juan Carlos" required>
                            <small id="nombresError" class="error-text"></small>
                        </div>
                        <div class="form-group">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" name="apellidos" maxlength="30" placeholder="Pérez Gómez" required>
                            <small id="apellidosError" class="error-text"></small>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dni">DNI</label>
                            <input type="text" id="dni" name="dni" maxlength="8" placeholder="12345678" required>
                            <small id="dniError" class="error-text"></small>
                        </div>
                        <div class="form-group">
                            <label for="celular">Celular</label>
                            <input type="tel" id="celular" name="celular" maxlength="9" placeholder="987654321" required>
                            <small id="celularError" class="error-text"></small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="juan@ejemplo.com" required>
                        <small id="correoError" class="error-text"></small>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                        <small id="passwordError" class="error-text"></small>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirmar Contraseña</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite tu contraseña" required>
                        <small id="confirmPasswordError" class="error-text"></small>
                    </div>

                    <button type="submit" class="btn-cabot btn-primary btn-full" style="margin-top: 10px;">
                        <span class="btn-icon">✓</span> Registrarse
                    </button>
                </form>

                <div class="divider" style="margin: 15px 0;"></div>

                <button class="btn-cabot btn-secondary btn-full" onclick="window.location.href='/login'">
                    ¿Ya tienes cuenta? Inicia sesión aquí
                </button>

                <div id="message" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        function limpiarErrores() {
            document.querySelectorAll('.error-text').forEach(e => e.textContent = '');
            document.querySelectorAll('input').forEach(i => i.classList.remove('error'));
            messageDiv.innerHTML = '';
        }

        function mostrarError(inputId, errorId, mensaje) {
            document.getElementById(errorId).textContent = mensaje;
            document.getElementById(inputId).classList.add('error');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            limpiarErrores();

            const nombres = document.getElementById('nombres').value.trim();
            const apellidos = document.getElementById('apellidos').value.trim();
            const dni = document.getElementById('dni').value.trim();
            const celular = document.getElementById('celular').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(nombres)) { mostrarError('nombres', 'nombresError', 'Nombre inválido'); return; }
            if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(apellidos)) { mostrarError('apellidos', 'apellidosError', 'Apellido inválido'); return; }
            if (!/^\d{8}$/.test(dni)) { mostrarError('dni', 'dniError', 'DNI debe tener 8 números'); return; }
            if (!/^9\d{8}$/.test(celular)) { mostrarError('celular', 'celularError', 'Celular de 9 dígitos (inicio 9)'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) { mostrarError('correo', 'correoError', 'Correo inválido'); return; }
            if (password.length < 6) { mostrarError('password', 'passwordError', 'Mínimo 6 caracteres'); return; }
            if (password !== confirmPassword) { mostrarError('confirm_password', 'confirmPasswordError', 'Contraseñas no coinciden'); return; }

            messageDiv.innerHTML = '<div class="loading">Creando cuenta...</div>';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombres, apellidos, dni, celular, correo, password })
                });
                const data = await response.json();
                if (data.success) {
                    messageDiv.innerHTML = '<div class="success">✅ ' + data.message + '</div>';
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    messageDiv.innerHTML = '<div class="error">❌ ' + data.message + '</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">❌ Error de conexión</div>';
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/cabot.js') }}"></script>
</body>
</html>
