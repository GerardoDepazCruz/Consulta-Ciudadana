<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - CABOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="profile-page">
        <div class="profile-card">

            <button class="btn-cabot btn-secondary" style="width: auto; padding: 10px 20px; margin-bottom: 20px;" onclick="window.location.href='/dashboard'">
                ← Volver
            </button>

            <form id="formAvatar" action="/perfil/avatar" method="POST" enctype="multipart/form-data">
                <div class="profile-image">
                    <img id="avatarPreview" src="{{ avatar_url }}" alt="Perfil">
                    <label class="avatar-edit">
                        Cambiar foto
                        <input type="file" id="avatarInput" name="avatar" accept="image/*">
                    </label>
                </div>

                <button type="submit" class="btn-cabot btn-primary btn-full">
                    Guardar foto
                </button>
                <div id="mensajeGuardandoFoto" style="display:none; margin-top:15px; text-align:center; color:#1a5fa8; font-weight:600;">
                    ⏳ Guardando foto...
                </div>
            </form>

            <h2 style="margin-top: 25px; font-size: 26px;">{{ user.nombres }} {{ user.apellidos }}</h2>

            <form id="formPerfil" action="/actualizar_perfil" method="POST">
                <div class="profile-field">
                    <label>Nombres</label>
                    <input type="text" id="nombres" name="nombres" value="{{ user.nombres }}" maxlength="30" required>
                </div>
                <div class="profile-field">
                    <label>Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" value="{{ user.apellidos }}" maxlength="30" required>
                </div>
                <div class="profile-field">
                    <label>Teléfono</label>
                    <input type="text" id="celular" name="celular" value="{{ user.celular }}" maxlength="9" required>
                </div>
                <div class="profile-field">
                    <label>Email</label>
                    <input type="email" id="correo" name="correo" value="{{ user.correo }}" required>
                </div>
                <div class="profile-field">
                    <label>DNI</label>
                    <input type="text" id="dni" name="dni" value="{{ user.dni }}" maxlength="8" required>
                </div>

                <button type="submit" class="btn-cabot btn-primary btn-full" style="margin-top: 15px;">
                    Guardar cambios
                </button>
                <div id="mensajePerfil" style="display:none; margin-top:15px; text-align:center; color:#1a5fa8; font-weight:600;">
                    ⏳ Guardando cambios...
                </div>
            </form>

            <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 15px;">
                <button class="btn-cabot btn-danger btn-full" onclick="window.location.href='/logout'">
                    CERRAR SESIÓN
                </button>
                <button class="btn-cabot btn-secondary btn-full">
                    ¿Necesitas ayuda?
                </button>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/perfil.js') }}"></script>
    <script>
        document.getElementById('formAvatar').addEventListener('submit', () => {
            document.getElementById('mensajeGuardandoFoto').style.display = 'block';
        });

        document.getElementById('formPerfil').addEventListener('submit', function (e) {
            e.preventDefault();
            const nombres = document.getElementById('nombres').value.trim();
            const apellidos = document.getElementById('apellidos').value.trim();
            const celular = document.getElementById('celular').value.trim();
            const dni = document.getElementById('dni').value.trim();
            
            if (!/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(nombres) || !/^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/.test(apellidos)) { alert('❌ El nombre y apellido no pueden contener números'); return; }
            if (!/^\d{9}$/.test(celular) || !/^\d{8}$/.test(dni)) { alert('❌ Formato de celular o DNI incorrecto'); return; }

            document.getElementById('mensajePerfil').style.display = 'block';
            this.submit();
        });
    </script>
    <script src="{{ url_for('static', filename='js/cabot.js') }}"></script>
</body>
</html>
